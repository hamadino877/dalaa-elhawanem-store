<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم دلع الهوانم - إضافة منتجات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow-md">
        <div class="flex items-center gap-3 mb-6">
            <span class="bg-teal-700 text-white w-11 h-11 rounded-full flex items-center justify-center text-lg font-black">د.ه</span>
            <div>
                <h1 class="text-2xl font-bold text-gray-800">دلع الهوانم</h1>
                <p class="text-xs text-gray-500">لوحة تحكم إضافة منتج جديد</p>
            </div>
        </div>
        
        <form id="add-product-form" class="space-y-4">
            <div>
                <label class="block text-sm font-bold mb-1">اسم المنتج</label>
                <input type="text" id="p-title" required class="w-full border p-2 rounded-lg">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold mb-1">السعر (ج.م)</label>
                    <input type="number" id="p-price" required class="w-full border p-2 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">السعر قبل الخصم</label>
                    <input type="number" id="p-old-price" class="w-full border p-2 rounded-lg">
                </div>
            </div>
            <div>
                <label class="block text-sm font-bold mb-1">رابط صورة المنتج</label>
                <input type="url" id="p-image" required class="w-full border p-2 rounded-lg">
            </div>
            <div>
                <label class="block text-sm font-bold mb-1">وصف المنتج</label>
                <textarea id="p-desc" class="w-full border p-2 rounded-lg" rows="3"></textarea>
            </div>
            <div>
                <label class="block text-sm font-bold mb-1">حالة المنتج</label>
                <select id="p-status" class="w-full border p-2 rounded-lg">
                    <option value="available">متوفر في المخزون</option>
                    <option value="out_of_stock">نفدت الكمية</option>
                </select>
            </div>
            <button type="button" onclick="saveProduct()" class="w-full bg-emerald-600 text-white py-3 rounded-lg font-bold hover:bg-emerald-700">
                حفظ ونشر المنتج
            </button>
        </form>

        <div class="mt-6 pt-4 border-t text-xs text-gray-500 text-center space-y-1">
            <p>دلع الهوانم - المحلة الكبرى، شارع البهلوان</p>
            <p>هاتف / واتساب: 01065852975</p>
        </div>
    </div>

    <script>
        function saveProduct() {
            const product = {
                id: Date.now(),
                title: document.getElementById('p-title').value,
                price: document.getElementById('p-price').value,
                oldPrice: document.getElementById('p-old-price').value,
                image: document.getElementById('p-image').value,
                desc: document.getElementById('p-desc').value,
                status: document.getElementById('p-status').value
            };

            // حفظ المنتجات في الـ LocalStorage (أو ربطها بـ Firebase)
            let products = JSON.parse(localStorage.getItem('my_products') || '[]');
            products.push(product);
            localStorage.setItem('my_products', JSON.stringify(products));

            alert('تمت إضافة المنتج بنجاح!');
            document.getElementById('add-product-form').reset();
        }
    </script>
</body>
</html>
