<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>دلع الهوانم - قائمة المنتجات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-50 pb-12">
    <!-- Navbar / Cart Summary -->
    <header class="bg-white shadow p-4 sticky top-0 flex justify-between items-center max-w-6xl mx-auto">
        <div class="flex items-center gap-2">
            <span class="bg-teal-700 text-white w-10 h-10 rounded-full flex items-center justify-center text-base font-black">د.ه</span>
            <h1 class="text-xl font-bold text-emerald-700">دلع الهوانم</h1>
        </div>
        <div class="bg-emerald-100 text-emerald-800 px-4 py-2 rounded-full font-bold">
            🛒 السلة: <span id="cart-count">0</span> منتجات
        </div>
    </header>

    <!-- Products Grid -->
    <main class="max-w-6xl mx-auto p-6">
        <h2 class="text-2xl font-bold mb-6">المنتجات المتاحة</h2>
        <div id="products-list" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- المنتجات تُحمل هنا تلقائياً -->
        </div>
    </main>

    <!-- Footer / Contact -->
    <footer class="bg-gray-900 text-gray-400 mt-12 py-8 border-t border-gray-800">
        <div class="max-w-6xl mx-auto px-4 text-center space-y-4">
            <div class="flex items-center justify-center gap-2">
                <span class="bg-teal-700 text-white w-10 h-10 rounded-full flex items-center justify-center text-base font-black">د.ه</span>
                <div class="text-2xl font-black text-white">دلع الهوانم</div>
            </div>
            <div class="flex flex-col md:flex-row items-center justify-center gap-3 md:gap-6 text-sm pt-2">
                <span class="flex items-center gap-2">
                    <i class="fa-solid fa-location-dot text-teal-500"></i>
                    المحلة الكبرى - شارع البهلوان
                </span>
                <a href="tel:01065852975" class="flex items-center gap-2 hover:text-white transition">
                    <i class="fa-solid fa-phone text-teal-500"></i>
                    01065852975
                </a>
                <a href="https://wa.me/201065852975" target="_blank" class="flex items-center gap-2 hover:text-white transition">
                    <i class="fa-brands fa-whatsapp text-teal-500"></i>
                    واتساب: 01065852975
                </a>
            </div>
            <div class="text-xs text-gray-500 pt-4 border-t border-gray-800">
                جميع الحقوق محفوظة &copy; 2026 - دلع الهوانم
            </div>
        </div>
    </footer>

    <script>
        let cartCount = 0;

        function loadProducts() {
            const container = document.getElementById('products-list');
            const products = JSON.parse(localStorage.getItem('my_products') || '[]');

            if (products.length === 0) {
                container.innerHTML = `<p class="text-gray-500">لا توجد منتجات معروضة حالياً. أضف منتجات من لوحة التحكم.</p>`;
                return;
            }

            container.innerHTML = products.map(p => `
                <div class="bg-white border rounded-2xl p-4 shadow-sm space-y-3">
                    <img src="${p.image}" class="w-full h-48 object-cover rounded-xl">
                    <h3 class="font-bold text-lg">${p.title}</h3>
                    <p class="text-gray-500 text-xs">${p.desc}</p>
                    <div class="flex items-baseline justify-between">
                        <span class="text-emerald-600 font-extrabold text-xl">${p.price} ج.م</span>
                        ${p.oldPrice ? `<span class="line-through text-gray-400 text-sm">${p.oldPrice} ج.م</span>` : ''}
                    </div>
                    ${p.status === 'available' ? 
                        `<button onclick="addToCart()" class="w-full bg-emerald-600 text-white py-2 rounded-xl font-bold hover:bg-emerald-700">إضافة للسلة 🛒</button>` :
                        `<button disabled class="w-full bg-gray-300 text-gray-600 py-2 rounded-xl font-bold cursor-not-allowed">نفدت الكمية</button>`
                    }
                </div>
            `).join('');
        }

        function addToCart() {
            cartCount++;
            document.getElementById('cart-count').innerText = cartCount;
        }

        loadProducts();
    </script>
</body>
</html>
